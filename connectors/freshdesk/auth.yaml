type: recipe
use: basic
inputs:
- {id: username, remove: true}
- {id: password, remove: true}
- id: subdomain
  label: Freshdesk subdomain (the part before .freshdesk.com)
  pattern: '[a-z0-9][a-z0-9-]{0,62}'
  stage: credentials
- {id: api_key, label: API key, secret: true, component: secret}
basic:
  username: '{secret.api_key}'
  password: X
base_url: https://{config.subdomain}.freshdesk.com/api/v2
probe:
  request: {url: 'https://{config.subdomain}.freshdesk.com/api/v2/agents/me'}
