apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: asana
  version: 1.0.0
  coreAbi: '3'
  name: Asana
  company: Asana
  description: Sync Asana workspace projects, users, teams and tags through the OpenMerge ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/asana.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Asana OAuth app}
api:
  base_url: https://app.asana.com/api/1.0/workspaces/{workspace_gid}
  describe_endpoint: /
  pagination: {mode: cursor, next_path: next_page.offset, param: offset, records_path: data}
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: All lists are workspace-scoped (/workspaces/{workspace_gid}/...). Pagination requires limit (1-100) and
    follows next_page.offset. Compact records only carry gid/name/resource_type, so every list passes opt_fields.
    GET /workspaces/{gid}/teams only works for organization workspaces. GET /workspaces/{gid}/users takes no limit
    and returns at most 2000 users (alphabetical), following next_page.offset if present.
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://developers.asana.com/reference/rest-api-reference
