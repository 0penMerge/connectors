apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: gorgias
  version: 1.0.0
  coreAbi: '3'
  name: Gorgias
  company: Gorgias
  description: Sync Gorgias tickets, messages, customers, users, teams and tags through the OpenMerge ticketing
    model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/gorgias.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: [update]
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Gorgias OAuth app}
api:
  base_url: https://{subdomain}.gorgias.com/api
  describe_endpoint: /
  pagination: {mode: cursor, next_path: meta.next_cursor, param: cursor, records_path: data}
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: Lists return {data:[...], meta:{next_cursor, prev_cursor}} with cursor/limit (max 100). No updated-since
    filter exists on list endpoints, so every model is a full hash snapshot. GET /tickets includes trashed tickets
    by default (trashed=true). Ticket messages are listed account-wide via GET /messages. Message 'public' (false
    = internal note) and sender ids (user or customer, depending on from_agent) stay in remote_data because they
    cannot be mapped without inversion/branching.
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://developers.gorgias.com/reference/introduction
