{
  "apiVersion": "openmerge.dev/connector/v1",
  "kind": "Connector",
  "metadata": {
    "id": "jira_data_center",
    "version": "1.0.0",
    "coreAbi": "2",
    "name": "Jira Data Center",
    "company": "Atlassian",
    "description": "Sync self-hosted Jira Data Center issues, projects, users and roles through the OpenMerge ticketing model.",
    "logo": {
      "url": "https://cdn.openmerge.dev/connectors/jira_data_center.svg"
    }
  },
  "runtime": {
    "entrypoint": "plugin.py:JiraDataCenterPlugin"
  },
  "categories": [
    "ticketing@1"
  ],
  "capabilities": {
    "reads": [
      "hash_snapshot"
    ],
    "writes": [],
    "dynamicSchema": false,
    "customFields": false
  },
  "auth": {
    "type": "oauth2",
    "driver": "oauth2",
    "authorization_url": "https://{host}/rest/oauth2/latest/authorize",
    "token_url": "https://{host}/rest/oauth2/latest/token",
    "refresh_rotates": true,
    "rotation_grace_seconds": 0,
    "scopes_param": "scope",
    "default_scopes": [
      "READ"
    ],
    "scope_catalog": [
      {
        "id": "READ",
        "label": "Read",
        "description": "View projects, issues, users and roles the authorizing user can see.",
        "models": [
          "Ticket",
          "Collection",
          "User",
          "Role"
        ],
        "operations": [
          "read"
        ],
        "recommended": true
      },
      {
        "id": "WRITE",
        "label": "Write",
        "description": "Create and edit issues and comments (includes READ)."
      },
      {
        "id": "ADMIN",
        "label": "Project admin",
        "description": "Administer projects the user administers (includes WRITE)."
      },
      {
        "id": "SYSTEM_ADMIN",
        "label": "System admin",
        "description": "Full system administration (includes ADMIN); avoid unless required."
      }
    ],
    "connection_config_fields": [
      "host"
    ],
    "scope_separator": " ",
    "notes": "Jira Data Center OAuth 2.0 provider (incoming application link, Jira 8.22+). The admin creates an External application link with redirect URL = the OpenMerge callback; endpoints are per instance at https://{host}/rest/oauth2/latest/{authorize,token}. host is the instance origin without scheme and may include a context path (e.g. jira.example.com or example.com/jira). PKCE (S256) is supported but not required. Access tokens live 2 hours; refreshing invalidates the previous access and refresh token pair. The instance must be reachable from OpenMerge over HTTPS."
  },
  "setup": {
    "oauthAppFields": [
      {
        "id": "client_id",
        "component": "text",
        "label": "Client ID",
        "required": true
      },
      {
        "id": "client_secret",
        "component": "secret",
        "label": "Client secret",
        "required": true,
        "writeOnly": true
      }
    ],
    "instructions": [
      {
        "component": "callback_url",
        "label": "Add this redirect URL to your Jira Data Center OAuth app"
      }
    ]
  },
  "api": {
    "base_url": "https://{host}",
    "describe_endpoint": "/",
    "pagination": {
      "style": "offset",
      "param": "startAt",
      "records_path": "issues",
      "next_path": "next",
      "limit_param": "maxResults"
    },
    "rate_limit_headers": {
      "remaining": null,
      "reset": null,
      "reset_style": "auto_seconds"
    },
    "authorization_scheme": "Bearer",
    "schema_adapter": "declared",
    "notes": "REST API v2. Issue search uses GET /rest/api/2/search with startAt/maxResults (max 100 per page by default, jira.search.views.default.max). Users use /rest/api/2/user/search?username=. (wildcard); on Jira 10.x this endpoint caps results at 100 and startAt >= 100 is unreliable (JRASERVER-78520) - on 10.13.3+/11.x prefer /rest/api/2/user/list. Projects and roles return bare arrays without paging. Per-instance OAuth URLs need the connect flow to interpolate {host} before redirecting."
  },
  "webhooks": {
    "supported": false,
    "automatic": false
  },
  "provenance": {
    "author": "human:nath@datakart.ai",
    "created_at": "2026-11-12T00:00:00Z",
    "reason": "Provider descriptor for the Merge-compatible Ticketing category, from https://developer.atlassian.com/server/jira/platform/rest/"
  }
}
