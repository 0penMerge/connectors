apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: rally
  version: 1.0.0
  coreAbi: '3'
  name: Rally
  company: Broadcom
  description: Sync Rally (Broadcom Agile Central) work items, projects, users, tags, discussions and attachments
    through the OpenMerge ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/rally.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Rally OAuth app}
api:
  base_url: https://rally1.rallydev.com/slm/webservice/v2.0
  describe_endpoint: /
  pagination:
    first: 1
    mode: offset
    param: start
    records_path: QueryResult.Results
    size: 200
    limit_param: pagesize
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: 'The OAuth access token is sent in the ZSESSIONID header (api.auth_headers). Queries return {QueryResult:
    {Results: [...], TotalResultCount, StartIndex, PageSize}} and page with 1-based start plus pagesize (max 2000).
    Queries run against the authorizing user''s default workspace unless a workspace=/workspace/<ObjectID> parameter
    is added. References are objects with _ref, _refObjectUUID and _refObjectName; records are keyed by ObjectUUID.
    Explicit fetch lists are used instead of fetch=true per Broadcom WSAPI best practice.'
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://rally1.rallydev.com/slm/doc/webservice/
