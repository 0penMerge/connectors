type: recipe
use: oauth2.authorization_code
authorize:
  url: https://rally1.rallydev.com/login/oauth2/auth
token:
  url: https://rally1.rallydev.com/login/oauth2/token
scopes:
  param: scope
  separator: ' '
  default: [alm]
apply:
  headers: {Authorization: null, ZSESSIONID: '{access_token}'}
scope_catalog:
- id: alm
  label: Rally ALM
  description: 'Rally''s single OAuth scope: access the Web Services API (WSAPI) with the authorizing user''s Rally
    permissions.'
notes: 'Create an OAuth client in Rally under Settings > Access > OAuth Clients (client id, client secret, callback
  URL). Authorization-code grant: GET /login/oauth2/auth with response_type=code, client_id, redirect_uri, scope=alm,
  state; then POST form-encoded code, redirect_uri, grant_type=authorization_code, client_id, client_secret to /login/oauth2/token.
  Rally expects the resulting access token in a ''ZSESSIONID: <token>'' request header (the same header used for
  Rally API keys), not ''Authorization: Bearer''.'
