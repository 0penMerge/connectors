apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: zoho_desk
  version: 1.0.0
  coreAbi: '3'
  name: Zoho Desk
  company: Zoho Corporation
  description: Sync Zoho Desk tickets, contacts, accounts, agents, departments, teams and roles through the OpenMerge
    ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/zoho_desk.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: [update]
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Zoho Desk OAuth app}
api:
  base_url: https://desk.zoho.com/api/v1
  describe_endpoint: /
  pagination:
    first: 0
    mode: offset
    param: from
    records_path: data
    size: 100
    limit_param: limit
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Zoho-oauthtoken
  schema_adapter: declared
  notes: Every endpoint except /organizations needs the orgId header, rendered from the org_id connection value
    (GET /api/v1/organizations lists the ids). Lists page with from (zero-based index) + limit (tickets/contacts/accounts
    max 100; agents/departments/teams max 200; roles max 500) and wrap rows in data (teams in teams). An empty page
    returns HTTP 204. US data center host desk.zoho.com; other regions use desk.zoho.eu/.in/.com.au/.jp/.sa/.ae/.sg/zohocloud.ca/.com.cn.
    Calls cost API credits per edition.
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://desk.zoho.com/DeskAPIDocument
