apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: teamwork
  version: 1.0.0
  coreAbi: '3'
  name: Teamwork.com
  company: Teamwork
  description: Sync Teamwork.com tasks, projects, people, teams, tags and task comments through the OpenMerge ticketing
    model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/teamwork.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot, timestamp_delta]
  writes: [update]
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Teamwork.com OAuth app}
api:
  base_url: '{api_endpoint}'
  describe_endpoint: /
  pagination:
    first: 1
    mode: page
    param: page
    records_path: tasks
    size: 50
    limit_param: pageSize
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: Projects API v3 (/projects/api/v3/...) for tasks, projects, people, tags and comments; teams only exist
    in v1 (/teams.json). Lists use page/pageSize (default 50, kept at 50 so a short page reliably means the last
    page). Tasks support updatedAfter (date-time) with orderBy=updatedat&orderMode=asc for incremental reads.
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://apidocs.teamwork.com/docs/teamwork/v3
