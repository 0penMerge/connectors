apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: dixa
  version: 1.0.0
  coreAbi: '3'
  name: Dixa
  company: Dixa
  description: Sync Dixa agents, teams, end users and tags through the OpenMerge ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/dixa.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup: {}
api:
  base_url: https://dev.dixa.io
  describe_endpoint: /
  pagination: {mode: next_url, next_path: meta.next, records_path: data}
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: 'Rate limit is 10 requests/second per token with bursts of 4. Paginated lists return data[] plus meta.next,
    a path-relative URL carrying an opaque pageKey; teams and tags return data[] without pagination. Conversations
    have no plain list endpoint: GET /v1/search/conversations requires a free-text query and the full conversation
    export lives on a separate host (https://exports.dixa.io/v1/conversation_export), so tickets are not inventoried
    by this connector. Create an API token in Dixa under Settings > Integrations > API Tokens (Dixa API version
    v1). The token is sent in the Authorization header as ''Authorization: Bearer <api_token>'' (the OpenAPI security
    scheme is an apiKey in the Authorization header).'
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://docs.dixa.io/openapi/dixa-api/v1/
