{
  "apiVersion": "openmerge.dev/connector/v1",
  "kind": "Connector",
  "metadata": {
    "id": "kustomer",
    "version": "1.0.0",
    "coreAbi": "2",
    "name": "Kustomer",
    "company": "Kustomer",
    "description": "Sync Kustomer conversations, customers, companies, messages, users and teams through the OpenMerge ticketing model.",
    "logo": {
      "url": "https://cdn.openmerge.dev/connectors/kustomer.svg"
    }
  },
  "runtime": {
    "entrypoint": "plugin.py:KustomerPlugin"
  },
  "categories": [
    "ticketing@1"
  ],
  "capabilities": {
    "reads": [
      "hash_snapshot"
    ],
    "writes": [
      "update"
    ],
    "dynamicSchema": false,
    "customFields": false
  },
  "auth": {
    "type": "password",
    "driver": "api_key",
    "connection_config_fields": [
      "orgname"
    ],
    "default_scopes": [],
    "scope_catalog": []
  },
  "setup": {
    "credentialFields": [
      {
        "id": "orgname",
        "component": "text",
        "label": "Organization name (the <orgname> in <orgname>.kustomerapp.com)",
        "required": true,
        "writeOnly": false
      },
      {
        "id": "api_key",
        "component": "secret",
        "label": "API key",
        "required": true,
        "writeOnly": true
      }
    ]
  },
  "api": {
    "base_url": "https://{orgname}.api.kustomerapp.com",
    "describe_endpoint": "/",
    "pagination": {
      "style": "cursor",
      "param": "cursor",
      "records_path": "data",
      "next_path": "links.next"
    },
    "rate_limit_headers": {
      "remaining": null,
      "reset": null,
      "reset_style": "auto_seconds"
    },
    "authorization_scheme": "Bearer",
    "schema_adapter": "declared",
    "auth_headers": {
      "Authorization": "Bearer {secret.api_key}"
    },
    "notes": "JSON:API style responses: records are in data[] with fields under attributes and references under relationships.<name>.data.id. Lists paginate with page/pageSize and return a path-relative links.next URL (null on the last page). PATCH /v1/conversations/{id} documents Content-Type application/json-patch+json while accepting a merge object; PUT /v1/conversations/{id} with application/json is the plain alternative. Kustomer API keys are created in Settings > Security > API Keys and sent as 'Authorization: Bearer <API key>'. The key needs the read roles org.permission.conversation.read, org.permission.customer.read, org.permission.company.read, org.permission.message.read, org.permission.user.read and org.permission.team.read (or their legacy org.user.* equivalents); writes need org.permission.conversation.update."
  },
  "webhooks": {
    "supported": false,
    "automatic": false
  },
  "provenance": {
    "author": "human:nath@datakart.ai",
    "created_at": "2026-11-12T00:00:00Z",
    "reason": "Provider descriptor for the Merge-compatible Ticketing category, from https://developer.kustomer.com/api/core-resources"
  }
}
