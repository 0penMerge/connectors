{
  "apiVersion": "openmerge.dev/connector/v1",
  "kind": "Connector",
  "metadata": {
    "id": "gitlab",
    "version": "1.0.0",
    "coreAbi": "2",
    "name": "GitLab",
    "company": "GitLab",
    "description": "Sync GitLab group issues, projects, subgroups, labels and members through the OpenMerge ticketing model.",
    "logo": {
      "url": "https://cdn.openmerge.dev/connectors/gitlab.svg"
    }
  },
  "runtime": {
    "entrypoint": "plugin.py:GitlabPlugin"
  },
  "categories": [
    "ticketing@1"
  ],
  "capabilities": {
    "reads": [
      "hash_snapshot",
      "timestamp_delta"
    ],
    "writes": [],
    "dynamicSchema": false,
    "customFields": false
  },
  "auth": {
    "type": "oauth2",
    "driver": "oauth2",
    "authorization_url": "https://gitlab.com/oauth/authorize",
    "token_url": "https://gitlab.com/oauth/token",
    "refresh_rotates": true,
    "rotation_grace_seconds": 0,
    "scopes_param": "scope",
    "default_scopes": [
      "read_api"
    ],
    "scope_catalog": [
      {
        "id": "read_api",
        "label": "Read API",
        "description": "Read issues, projects, groups, labels and members.",
        "models": [
          "Ticket",
          "Collection",
          "Team",
          "Tag",
          "User"
        ],
        "operations": [
          "read"
        ],
        "recommended": true
      },
      {
        "id": "api",
        "label": "Full API",
        "description": "Read and write access to the API, including issues and notes."
      },
      {
        "id": "read_user",
        "label": "Read user",
        "description": "Read the authenticated user's profile."
      }
    ],
    "connection_config_fields": [
      "group_id"
    ],
    "scope_separator": " ",
    "notes": "GitLab.com OAuth 2.0 authorization code flow (PKCE recommended). Access tokens last 2 hours; each refresh revokes the previous access and refresh tokens. group_id is the top-level group's numeric id or URL-encoded full path, chosen by the user after authorization."
  },
  "setup": {
    "oauthAppFields": [
      {
        "id": "client_id",
        "component": "text",
        "label": "Client ID",
        "required": true
      },
      {
        "id": "client_secret",
        "component": "secret",
        "label": "Client secret",
        "required": true,
        "writeOnly": true
      }
    ],
    "instructions": [
      {
        "component": "callback_url",
        "label": "Add this redirect URL to your GitLab OAuth app"
      }
    ]
  },
  "api": {
    "base_url": "https://gitlab.com/api/v4/groups/{group_id}",
    "describe_endpoint": "/",
    "pagination": {
      "style": "offset",
      "param": "page",
      "records_path": "records",
      "next_path": "next",
      "limit_param": "per_page"
    },
    "rate_limit_headers": {
      "remaining": "RateLimit-Remaining",
      "reset": "RateLimit-Reset",
      "reset_style": "epoch_seconds"
    },
    "authorization_scheme": "Bearer",
    "schema_adapter": "declared",
    "notes": "All reads are bounded by one group (including subgroups), because the root GET /issues?scope=all can be rejected on GitLab.com. Offset pagination with page/per_page (max 100); bodies are bare arrays. Issue writes need project id + iid paths, so none are declared. Member emails are only returned to group owners for enterprise users."
  },
  "webhooks": {
    "supported": false,
    "automatic": false
  },
  "provenance": {
    "author": "human:nath@datakart.ai",
    "created_at": "2026-11-12T00:00:00Z",
    "reason": "Provider descriptor for the Merge-compatible Ticketing category, from https://docs.gitlab.com/api/issues/"
  }
}
