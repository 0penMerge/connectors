apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: gitlab
  version: 1.0.0
  coreAbi: '3'
  name: GitLab
  company: GitLab
  description: Sync GitLab group issues, projects, subgroups, labels and members through the OpenMerge ticketing
    model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/gitlab.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot, timestamp_delta]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your GitLab OAuth app}
api:
  base_url: https://gitlab.com/api/v4/groups/{group_id}
  describe_endpoint: /
  pagination:
    first: 1
    mode: page
    param: page
    size: 100
    limit_param: per_page
    records_path: $
  rate_limit_headers: {remaining: RateLimit-Remaining, reset: RateLimit-Reset, reset_style: epoch_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: All reads are bounded by one group (including subgroups), because the root GET /issues?scope=all can be
    rejected on GitLab.com. Offset pagination with page/per_page (max 100); bodies are bare arrays. Issue writes
    need project id + iid paths, so none are declared. Member emails are only returned to group owners for enterprise
    users.
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://docs.gitlab.com/api/issues/
