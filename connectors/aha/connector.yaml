{
  "apiVersion": "openmerge.dev/connector/v1",
  "kind": "Connector",
  "metadata": {
    "id": "aha",
    "version": "1.0.0",
    "coreAbi": "2",
    "name": "Aha!",
    "company": "Aha! Labs",
    "description": "Sync Aha! features, workspaces and users for one account through the OpenMerge ticketing model.",
    "logo": {
      "url": "https://cdn.openmerge.dev/connectors/aha.svg"
    }
  },
  "runtime": {
    "entrypoint": "plugin.py:AhaPlugin"
  },
  "categories": [
    "ticketing@1"
  ],
  "capabilities": {
    "reads": [
      "hash_snapshot"
    ],
    "writes": [
      "update"
    ],
    "dynamicSchema": false,
    "customFields": false
  },
  "auth": {
    "type": "password",
    "driver": "api_key",
    "connection_config_fields": [
      "subdomain"
    ],
    "default_scopes": [],
    "scope_catalog": []
  },
  "setup": {
    "credentialFields": [
      {
        "id": "subdomain",
        "component": "text",
        "label": "Account subdomain (<subdomain>.aha.io)",
        "required": true,
        "writeOnly": false
      },
      {
        "id": "api_key",
        "component": "secret",
        "label": "API key",
        "required": true,
        "writeOnly": true
      }
    ]
  },
  "api": {
    "base_url": "https://{subdomain}.aha.io/api/v1",
    "describe_endpoint": "/",
    "pagination": {
      "style": "offset",
      "param": "page",
      "records_path": "features",
      "next_path": "next",
      "limit_param": "per_page"
    },
    "rate_limit_headers": {
      "remaining": null,
      "reset": null,
      "reset_style": "auto_seconds"
    },
    "authorization_scheme": "Bearer",
    "schema_adapter": "declared",
    "auth_headers": {
      "Authorization": "Bearer {secret.api_key}"
    },
    "notes": "All calls go to the account-specific host. Lists use page/per_page (max 200) with records under the resource name plus a pagination object. The feature list returns a slim record unless fields= is given, so the list path requests the mapped fields explicitly. Aha! API keys are sent as Authorization: Bearer <key>. Aha! OAuth2 exists but its token endpoint is account-specific (https://<subdomain>.aha.io/oauth/token), which a fixed token_url cannot express, so an API key is used."
  },
  "webhooks": {
    "supported": false,
    "automatic": false
  },
  "provenance": {
    "author": "human:nath@datakart.ai",
    "created_at": "2026-11-12T00:00:00Z",
    "reason": "Provider descriptor for the Merge-compatible Ticketing category, from https://www.aha.io/api"
  }
}
