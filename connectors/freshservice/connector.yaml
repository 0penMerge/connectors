apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: freshservice
  version: 1.0.0
  coreAbi: '3'
  name: Freshservice
  company: Freshworks
  description: Sync Freshservice tickets, requesters, agents, departments, agent groups and roles through the OpenMerge
    ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/freshservice.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: [update]
  dynamicSchema: false
  customFields: false
setup: {}
api:
  base_url: https://{subdomain}.freshservice.com/api/v2
  describe_endpoint: /
  pagination:
    first: 1
    mode: page
    param: page
    records_path: tickets
    size: 100
    limit_param: per_page
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Basic
  schema_adapter: declared
  notes: 'Lists are wrapped ({tickets:[...]}, {requesters:[...]}, ...) and paged with page/per_page (max 100). GET
    /tickets only returns tickets created in the last 30 days unless updated_since is supplied, so the list path
    pins updated_since to the epoch. Ticket lists can only be ordered by created_at, so tickets use a full hash
    snapshot rather than a timestamp delta. Tags and other embeds need include=... (2 extra credits each) and are
    not requested. Ticket status/priority are integers and stay in remote_data. Agent groups default to the primary
    workspace on multi-workspace accounts. Requesters and agents carry first_name/last_name only (no full-name field),
    so the unified name is left to remote_data. Authenticates with an agent''s API key over HTTP Basic auth: Authorization:
    Basic base64(''<api_key>:X''). The worker sends ''Authorization: Basic <token>'', so the stored token must be
    the Base64 of ''<api_key>:X''. Freshservice also gained Freshworks-org OAuth (scopes such as freshservice.tickets.view)
    in 2024, but it is tied to the customer''s *.myfreshworks.com org host and Freshworks app registration; API
    key remains the documented default for server-to-server access.'
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://api.freshservice.com/
