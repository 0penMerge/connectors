apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: spotdraft
  version: 1.0.0
  coreAbi: '3'
  name: SpotDraft
  company: SpotDraft
  description: Sync SpotDraft contracts (as tickets), counterparties, users and roles through the OpenMerge ticketing
    model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/spotdraft.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup: {}
api:
  base_url: https://{region_host}
  describe_endpoint: /
  pagination:
    first: 1
    mode: page
    param: page
    records_path: results
    size: 50
    limit_param: limit
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: 'Public v2.1 list routes page with 1-based page and limit (default 10) and return {page, limit, total_results,
    results}. The rate limit is 10 requests/second per workspace. Keep calls on the workspace''s region host. Generate
    an API credential in SpotDraft under Settings > Developer settings. Server-to-server calls send two headers:
    ''client-id: <Client ID>'' and ''client-secret: <Client Secret>'' (optionally ''user-email'' to act as a workspace
    member). SpotDraft documents no OAuth authorization-code flow for third parties; the public routes also accept
    ''Authorization: Bearer <OAuth JWT>'' for workspace-user tokens issued by SpotDraft.'
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://api.spotdraft.com/api/docs
