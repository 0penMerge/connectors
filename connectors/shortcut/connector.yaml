apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: shortcut
  version: 1.0.0
  coreAbi: '3'
  name: Shortcut
  company: Shortcut
  description: Sync Shortcut epics, members, teams, labels and files through the OpenMerge ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/shortcut.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup: {}
api:
  base_url: https://api.app.shortcut.com/api/v3
  describe_endpoint: /
  pagination: {mode: single, records_path: $}
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: 'Members, groups, labels and files return bare arrays without pagination; epics use the paginated endpoint
    (page/page_size up to 250, records under data). Stories are not declared: the search API caps paging at 1000
    results and the full query endpoint is a POST, so neither yields a complete inventory. Shortcut has no public
    OAuth authorization-code flow; users create an API token under Settings > API Tokens. Shortcut documents the
    token in a Shortcut-Token header (the token query parameter is deprecated), not in Authorization.'
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://developer.shortcut.com/api/rest/v3
