{
  "apiVersion": "openmerge.dev/connector/v1",
  "kind": "Connector",
  "metadata": {
    "id": "shortcut",
    "version": "1.0.0",
    "coreAbi": "2",
    "name": "Shortcut",
    "company": "Shortcut",
    "description": "Sync Shortcut epics, members, teams, labels and files through the OpenMerge ticketing model.",
    "logo": {
      "url": "https://cdn.openmerge.dev/connectors/shortcut.svg"
    }
  },
  "runtime": {
    "entrypoint": "plugin.py:ShortcutPlugin"
  },
  "categories": [
    "ticketing@1"
  ],
  "capabilities": {
    "reads": [
      "hash_snapshot"
    ],
    "writes": [],
    "dynamicSchema": false,
    "customFields": false
  },
  "auth": {
    "type": "password",
    "driver": "api_key",
    "connection_config_fields": [],
    "default_scopes": [],
    "scope_catalog": []
  },
  "setup": {
    "credentialFields": [
      {
        "id": "api_token",
        "component": "secret",
        "label": "API token",
        "required": true,
        "writeOnly": true
      }
    ]
  },
  "api": {
    "base_url": "https://api.app.shortcut.com/api/v3",
    "describe_endpoint": "/",
    "pagination": {
      "style": "cursor",
      "param": "cursor",
      "records_path": "records",
      "next_path": "next"
    },
    "rate_limit_headers": {
      "remaining": null,
      "reset": null,
      "reset_style": "auto_seconds"
    },
    "authorization_scheme": "Bearer",
    "schema_adapter": "declared",
    "auth_headers": {
      "Shortcut-Token": "{secret.api_token}"
    },
    "notes": "Members, groups, labels and files return bare arrays without pagination; epics use the paginated endpoint (page/page_size up to 250, records under data). Stories are not declared: the search API caps paging at 1000 results and the full query endpoint is a POST, so neither yields a complete inventory. Shortcut has no public OAuth authorization-code flow; users create an API token under Settings > API Tokens. Shortcut documents the token in a Shortcut-Token header (the token query parameter is deprecated), not in Authorization."
  },
  "webhooks": {
    "supported": false,
    "automatic": false
  },
  "provenance": {
    "author": "human:nath@datakart.ai",
    "created_at": "2026-11-12T00:00:00Z",
    "reason": "Provider descriptor for the Merge-compatible Ticketing category, from https://developer.shortcut.com/api/rest/v3"
  }
}
