apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: hubspot_ticketing
  version: 1.0.0
  coreAbi: '3'
  name: HubSpot Ticketing
  company: HubSpot, Inc.
  description: Sync HubSpot Service Hub tickets, owners, companies and contacts through the OpenMerge ticketing
    model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/hubspot_ticketing.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: [create, update]
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your HubSpot Ticketing OAuth app}
api:
  base_url: https://api.hubapi.com
  describe_endpoint: /
  pagination: {mode: cursor, next_path: paging.next.after, param: after, records_path: results}
  rate_limit_headers:
    remaining: X-HubSpot-RateLimit-Remaining
    reset: X-HubSpot-RateLimit-Interval-Milliseconds
    reset_style: duration_milliseconds
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: CRM v3 object lists page with limit + after; the next cursor is paging.next.after. Requested properties
    are listed explicitly (unrequested ones are omitted). The list endpoint has no updated-since filter (only the
    POST search API does), so models are hash snapshots. hs_pipeline_stage and hs_pipeline are internal ids, not
    labels.
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://developers.hubspot.com/docs/guides/api/crm/objects/tickets
