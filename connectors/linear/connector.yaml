apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: linear
  version: 1.0.0
  coreAbi: '3'
  name: Linear
  company: Linear
  description: Sync Linear issues, projects, teams, users, labels, comments, attachments and customers through the
    OpenMerge ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/linear.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Linear OAuth app}
api:
  base_url: https://api.linear.app
  describe_endpoint: /
  pagination:
    has_more_path: data.issues.pageInfo.hasNextPage
    mode: graphql
    next_path: data.issues.pageInfo.endCursor
    path: /graphql
    query: query($first:Int!,$after:String){issues(first:$first,after:$after){nodes{id identifier title description
      priority priorityLabel dueDate createdAt updatedAt completedAt canceledAt url state{id name type} creator{id}
      assignee{id} parent{id} team{id} project{id} labelIds} pageInfo{hasNextPage endCursor}}}
    records_path: data.issues.nodes
    size: 100
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: 'GraphQL only: every read is a POST to /graphql with Relay connections (first/after, pageInfo.hasNextPage/endCursor).
    Archived records are excluded by default. Writes are GraphQL mutations, so none are declared. Customers require
    the Customer Requests feature; the list is empty otherwise.'
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://linear.app/developers/graphql
