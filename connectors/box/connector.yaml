apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: box
  version: 1.0.0
  coreAbi: '3'
  name: Box
  company: Box
  description: Sync Box enterprise users and groups through the OpenMerge file storage model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/box.svg'}
categories: [filestorage@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Box OAuth app}
api:
  base_url: https://api.box.com
  describe_endpoint: /
  pagination:
    mode: offset
    param: offset
    records_path: entries
    size: 1000
    limit_param: limit
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: Box API 2.0. Users use marker pagination (usemarker=true, next_marker) because offset is capped at 10000;
    groups use offset/limit (max 1000). Enterprise listings require an admin or co-admin connection.
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible File Storage category, from https://developer.box.com/reference/
