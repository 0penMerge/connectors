{
  "apiVersion": "openmerge.dev/connector/v1",
  "kind": "Connector",
  "metadata": {
    "id": "box",
    "version": "1.0.0",
    "coreAbi": "2",
    "name": "Box",
    "company": "Box",
    "description": "Sync Box enterprise users and groups through the OpenMerge file storage model.",
    "logo": {
      "url": "https://cdn.openmerge.dev/connectors/box.svg"
    }
  },
  "runtime": {
    "entrypoint": "plugin.py:BoxPlugin"
  },
  "categories": [
    "filestorage@1"
  ],
  "capabilities": {
    "reads": [
      "hash_snapshot"
    ],
    "writes": [],
    "dynamicSchema": false,
    "customFields": false
  },
  "auth": {
    "type": "oauth2",
    "driver": "oauth2",
    "authorization_url": "https://account.box.com/api/oauth2/authorize",
    "token_url": "https://api.box.com/oauth2/token",
    "refresh_rotates": true,
    "rotation_grace_seconds": 0,
    "scopes_param": "scope",
    "default_scopes": [
      "root_readonly",
      "manage_managed_users",
      "manage_groups"
    ],
    "scope_catalog": [
      {
        "id": "root_readonly",
        "label": "Read all files and folders",
        "description": "Read files and folders the user can access."
      },
      {
        "id": "manage_managed_users",
        "label": "Manage users",
        "description": "List the enterprise's managed users (admin or co-admin authorization required).",
        "models": [
          "User"
        ],
        "operations": [
          "read"
        ]
      },
      {
        "id": "manage_groups",
        "label": "Manage groups",
        "description": "List the enterprise's groups (admin authorization required).",
        "models": [
          "Group"
        ],
        "operations": [
          "read"
        ]
      }
    ],
    "connection_config_fields": [],
    "scope_separator": " ",
    "notes": "Box OAuth 2.0 user authentication. Scopes must also be enabled on the Box app in the Developer Console; the scope parameter can only narrow them. Refresh tokens are single-use: every refresh returns a new refresh token and invalidates the old one."
  },
  "setup": {
    "oauthAppFields": [
      {
        "id": "client_id",
        "component": "text",
        "label": "Client ID",
        "required": true
      },
      {
        "id": "client_secret",
        "component": "secret",
        "label": "Client secret",
        "required": true,
        "writeOnly": true
      }
    ],
    "instructions": [
      {
        "component": "callback_url",
        "label": "Add this redirect URL to your Box OAuth app"
      }
    ]
  },
  "api": {
    "base_url": "https://api.box.com",
    "describe_endpoint": "/",
    "pagination": {
      "style": "offset",
      "param": "offset",
      "records_path": "entries",
      "next_path": "next",
      "limit_param": "limit"
    },
    "rate_limit_headers": {
      "remaining": null,
      "reset": null,
      "reset_style": "auto_seconds"
    },
    "authorization_scheme": "Bearer",
    "schema_adapter": "declared",
    "notes": "Box API 2.0. Users use marker pagination (usemarker=true, next_marker) because offset is capped at 10000; groups use offset/limit (max 1000). Enterprise listings require an admin or co-admin connection."
  },
  "webhooks": {
    "supported": false,
    "automatic": false
  },
  "provenance": {
    "author": "human:nath@datakart.ai",
    "created_at": "2026-11-12T00:00:00Z",
    "reason": "Provider descriptor for the Merge-compatible File Storage category, from https://developer.box.com/reference/"
  }
}
