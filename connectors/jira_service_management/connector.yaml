apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: jira_service_management
  version: 1.0.0
  coreAbi: '3'
  name: Jira Service Management
  company: Atlassian
  description: Sync Jira Service Management requests, service projects, customer organizations, users and roles
    through the OpenMerge ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/jira_service_management.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - component: callback_url
    label: Add this redirect URL to your Jira Service Management OAuth app
api:
  base_url: https://api.atlassian.com/ex/jira/{cloud_id}
  describe_endpoint: /
  pagination:
    mode: offset
    param: startAt
    records_path: values
    size: 50
    limit_param: maxResults
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: Requests are the Jira issues of service projects, read through enhanced JQL search filtered with projectType
    = service_desk (nextPageToken paging) so agents see every request, not only the ones they participate in (GET
    /rest/servicedeskapi/request is scoped to the calling user's involvement). Service Management list endpoints
    (organization) page with start/limit and isLastPage; platform lists page with startAt/maxResults. Requires a
    Jira Service Management agent licence for the connecting user.
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://developer.atlassian.com/cloud/jira/service-desk/rest/intro/
