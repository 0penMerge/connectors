{
  "apiVersion": "openmerge.dev/connector/v1",
  "kind": "Connector",
  "metadata": {
    "id": "jira_service_management",
    "version": "1.0.0",
    "coreAbi": "2",
    "name": "Jira Service Management",
    "company": "Atlassian",
    "description": "Sync Jira Service Management requests, service projects, customer organizations, users and roles through the OpenMerge ticketing model.",
    "logo": {
      "url": "https://cdn.openmerge.dev/connectors/jira_service_management.svg"
    }
  },
  "runtime": {
    "entrypoint": "plugin.py:JiraServiceManagementPlugin"
  },
  "categories": [
    "ticketing@1"
  ],
  "capabilities": {
    "reads": [
      "hash_snapshot"
    ],
    "writes": [],
    "dynamicSchema": false,
    "customFields": false
  },
  "auth": {
    "type": "oauth2",
    "driver": "oauth2",
    "authorization_url": "https://auth.atlassian.com/authorize",
    "token_url": "https://auth.atlassian.com/oauth/token",
    "refresh_rotates": true,
    "rotation_grace_seconds": 0,
    "scopes_param": "scope",
    "default_scopes": [
      "read:jira-work",
      "read:jira-user",
      "read:servicedesk-request",
      "manage:servicedesk-customer",
      "offline_access"
    ],
    "scope_catalog": [
      {
        "id": "offline_access",
        "label": "Offline access",
        "description": "Issue refresh tokens so syncs keep running.",
        "recommended": true
      },
      {
        "id": "read:jira-work",
        "label": "Read Jira work",
        "description": "Read service-project issues (requests), projects and project roles through the Jira platform API.",
        "models": [
          "Collection",
          "Comment",
          "Role",
          "Ticket"
        ],
        "operations": [
          "read"
        ]
      },
      {
        "id": "read:jira-user",
        "label": "Read Jira users",
        "description": "Read user profiles (agents and customers) and email addresses.",
        "models": [
          "User"
        ],
        "operations": [
          "read"
        ]
      },
      {
        "id": "read:servicedesk-request",
        "label": "Read service desk requests",
        "description": "Read service desks, request types and customer requests through the Service Management API."
      },
      {
        "id": "manage:servicedesk-customer",
        "label": "Manage service desk customers",
        "description": "Read customer organizations (GET /rest/servicedeskapi/organization requires this classic scope).",
        "models": [
          "Account"
        ],
        "operations": [
          "read"
        ]
      },
      {
        "id": "write:servicedesk-request",
        "label": "Write service desk requests",
        "description": "Create customer requests and add request comments."
      },
      {
        "id": "write:jira-work",
        "label": "Write Jira work",
        "description": "Create and edit issues and comments."
      }
    ],
    "connection_config_fields": [
      "cloud_id"
    ],
    "scope_separator": " ",
    "authorization_params": {
      "audience": "api.atlassian.com",
      "prompt": "consent"
    },
    "notes": "Atlassian 3LO (same app type as Jira Cloud), with the Jira Service Management API scopes enabled on the app. cloud_id is the site id returned by https://api.atlassian.com/oauth/token/accessible-resources after authorization."
  },
  "setup": {
    "oauthAppFields": [
      {
        "id": "client_id",
        "component": "text",
        "label": "Client ID",
        "required": true
      },
      {
        "id": "client_secret",
        "component": "secret",
        "label": "Client secret",
        "required": true,
        "writeOnly": true
      }
    ],
    "instructions": [
      {
        "component": "callback_url",
        "label": "Add this redirect URL to your Jira Service Management OAuth app"
      }
    ]
  },
  "api": {
    "base_url": "https://api.atlassian.com/ex/jira/{cloud_id}",
    "describe_endpoint": "/",
    "pagination": {
      "style": "offset",
      "param": "startAt",
      "records_path": "values",
      "next_path": "next",
      "limit_param": "maxResults"
    },
    "rate_limit_headers": {
      "remaining": null,
      "reset": null,
      "reset_style": "auto_seconds"
    },
    "authorization_scheme": "Bearer",
    "schema_adapter": "declared",
    "notes": "Requests are the Jira issues of service projects, read through enhanced JQL search filtered with projectType = service_desk (nextPageToken paging) so agents see every request, not only the ones they participate in (GET /rest/servicedeskapi/request is scoped to the calling user's involvement). Service Management list endpoints (organization) page with start/limit and isLastPage; platform lists page with startAt/maxResults. Requires a Jira Service Management agent licence for the connecting user."
  },
  "webhooks": {
    "supported": false,
    "automatic": false
  },
  "provenance": {
    "author": "human:nath@datakart.ai",
    "created_at": "2026-11-12T00:00:00Z",
    "reason": "Provider descriptor for the Merge-compatible Ticketing category, from https://developer.atlassian.com/cloud/jira/service-desk/rest/intro/"
  }
}
