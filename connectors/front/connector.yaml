{
  "apiVersion": "openmerge.dev/connector/v1",
  "kind": "Connector",
  "metadata": {
    "id": "front",
    "version": "1.0.0",
    "coreAbi": "2",
    "name": "Front",
    "company": "Front",
    "description": "Sync Front conversations, contacts, accounts, teammates, teams, tags and inboxes through the OpenMerge ticketing model.",
    "logo": {
      "url": "https://cdn.openmerge.dev/connectors/front.svg"
    }
  },
  "runtime": {
    "entrypoint": "plugin.py:FrontPlugin"
  },
  "categories": [
    "ticketing@1"
  ],
  "capabilities": {
    "reads": [
      "hash_snapshot"
    ],
    "writes": [],
    "dynamicSchema": false,
    "customFields": false
  },
  "auth": {
    "type": "oauth2",
    "driver": "oauth2",
    "authorization_url": "https://app.frontapp.com/oauth/authorize",
    "token_url": "https://app.frontapp.com/oauth/token",
    "refresh_rotates": false,
    "rotation_grace_seconds": null,
    "scopes_param": "scope",
    "default_scopes": [
      "default"
    ],
    "scope_catalog": [
      {
        "id": "default",
        "label": "Default access",
        "description": "Front OAuth requests carry no scope parameter; the app's resource access (shared/private namespaces, read/write) is configured on the Front app in the developer settings and granted at install."
      }
    ],
    "connection_config_fields": [],
    "token_endpoint_auth": "client_secret_basic",
    "notes": "Token exchange and refresh authenticate with HTTP Basic client_id:client_secret. Access tokens last 60 minutes; refresh tokens last 6 months and the same refresh token is returned on refresh until its final 24 hours, when a new one (new 6-month window) is issued, so always store the refresh_token from each response."
  },
  "setup": {
    "oauthAppFields": [
      {
        "id": "client_id",
        "component": "text",
        "label": "Client ID",
        "required": true
      },
      {
        "id": "client_secret",
        "component": "secret",
        "label": "Client secret",
        "required": true,
        "writeOnly": true
      }
    ],
    "instructions": [
      {
        "component": "callback_url",
        "label": "Add this redirect URL to your Front OAuth app"
      }
    ]
  },
  "api": {
    "base_url": "https://api2.frontapp.com",
    "describe_endpoint": "/",
    "pagination": {
      "style": "cursor",
      "param": "cursor",
      "records_path": "_results",
      "next_path": "_pagination.next"
    },
    "rate_limit_headers": {
      "remaining": null,
      "reset": null,
      "reset_style": "auto_seconds"
    },
    "authorization_scheme": "Bearer",
    "schema_adapter": "declared",
    "notes": "Lists return {_results:[...], _pagination:{next}} where next is a full api2.frontapp.com URL (null on the last page); limit max 100. Conversation timestamps are Unix epoch numbers, so created/updated datetimes stay in remote_data. Conversation contact, assignee and tags are nested objects/link URLs, not scalar ids, so they stay in remote_data. Teams are shown as Workspaces in the Front UI but keep the /teams endpoint."
  },
  "webhooks": {
    "supported": false,
    "automatic": false
  },
  "provenance": {
    "author": "human:nath@datakart.ai",
    "created_at": "2026-11-12T00:00:00Z",
    "reason": "Provider descriptor for the Merge-compatible Ticketing category, from https://dev.frontapp.com/reference/introduction"
  }
}
