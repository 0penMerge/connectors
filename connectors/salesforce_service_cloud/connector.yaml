apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: salesforce_service_cloud
  version: 1.0.0
  coreAbi: '3'
  name: Salesforce Service Cloud
  company: Salesforce, Inc.
  description: Sync Salesforce Service Cloud cases, case comments, accounts, contacts, users, queues/groups and
    roles through the OpenMerge ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/salesforce_service_cloud.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - component: callback_url
    label: Add this redirect URL to your Salesforce Service Cloud OAuth app
api:
  base_url: '{instance_url}'
  describe_endpoint: /
  pagination: {mode: next_url, next_path: nextRecordsUrl, records_path: records}
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: All lists are SOQL queries on /services/data/v67.0/query; pages follow nextRecordsUrl (path-relative on
    the instance host) until done=true. Rows carry an 'attributes' object. SOQL cannot take an updated-since query
    parameter, so every model is a hash snapshot. Service Cloud (Case) requires a Service Cloud or Sales Cloud edition
    with API access. Sforce-Limit-Info reports api-usage=used/limit for a 24h rolling window (no reset header).
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/resources_query.htm
