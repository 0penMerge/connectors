{
  "apiVersion": "openmerge.dev/connector/v1",
  "kind": "Connector",
  "metadata": {
    "id": "clickup",
    "version": "1.0.0",
    "coreAbi": "2",
    "name": "ClickUp",
    "company": "ClickUp",
    "description": "Sync ClickUp Workspace tasks, Spaces and custom roles through the OpenMerge ticketing model.",
    "logo": {
      "url": "https://cdn.openmerge.dev/connectors/clickup.svg"
    }
  },
  "runtime": {
    "entrypoint": "plugin.py:ClickUpPlugin"
  },
  "categories": [
    "ticketing@1"
  ],
  "capabilities": {
    "reads": [
      "hash_snapshot"
    ],
    "writes": [],
    "dynamicSchema": false,
    "customFields": false
  },
  "auth": {
    "type": "oauth2",
    "driver": "oauth2",
    "authorization_url": "https://app.clickup.com/api",
    "token_url": "https://api.clickup.com/api/v2/oauth/token",
    "refresh_rotates": false,
    "rotation_grace_seconds": null,
    "scopes_param": "scope",
    "default_scopes": [
      "default"
    ],
    "scope_catalog": [
      {
        "id": "default",
        "label": "Workspace access",
        "description": "ClickUp OAuth has no scopes; the user picks which Workspaces the app may access during authorization. Access tokens currently do not expire and no refresh token is issued."
      }
    ],
    "connection_config_fields": [
      "team_id"
    ],
    "notes": "ClickUp OAuth (authorization code). The token endpoint takes client_id, client_secret and code. team_id is the Workspace id returned by GET /api/v2/team after authorization."
  },
  "setup": {
    "oauthAppFields": [
      {
        "id": "client_id",
        "component": "text",
        "label": "Client ID",
        "required": true
      },
      {
        "id": "client_secret",
        "component": "secret",
        "label": "Client secret",
        "required": true,
        "writeOnly": true
      }
    ],
    "instructions": [
      {
        "component": "callback_url",
        "label": "Add this redirect URL to your ClickUp OAuth app"
      }
    ]
  },
  "api": {
    "base_url": "https://api.clickup.com/api/v2/team/{team_id}",
    "describe_endpoint": "/",
    "pagination": {
      "style": "cursor",
      "param": "cursor",
      "records_path": "data",
      "next_path": "next"
    },
    "rate_limit_headers": {
      "remaining": "X-RateLimit-Remaining",
      "reset": "X-RateLimit-Reset",
      "reset_style": "epoch_seconds"
    },
    "authorization_scheme": "Bearer",
    "schema_adapter": "declared",
    "notes": "API v2. All reads are Workspace-scoped (/team/{team_id}/...). OAuth tokens are sent as 'Authorization: Bearer'. Filtered team tasks return 100 tasks per zero-based page; ClickUp timestamps are Unix-millisecond strings, so date fields stay in remote_data. Custom roles require a plan with custom roles (Enterprise)."
  },
  "webhooks": {
    "supported": false,
    "automatic": false
  },
  "provenance": {
    "author": "human:nath@datakart.ai",
    "created_at": "2026-11-12T00:00:00Z",
    "reason": "Provider descriptor for the Merge-compatible Ticketing category, from https://developer.clickup.com/reference"
  }
}
