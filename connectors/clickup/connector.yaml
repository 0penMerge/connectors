apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: clickup
  version: 1.0.0
  coreAbi: '3'
  name: ClickUp
  company: ClickUp
  description: Sync ClickUp Workspace tasks, Spaces and custom roles through the OpenMerge ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/clickup.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your ClickUp OAuth app}
api:
  base_url: https://api.clickup.com/api/v2/team/{team_id}
  describe_endpoint: /
  pagination: {mode: single, records_path: data}
  rate_limit_headers: {remaining: X-RateLimit-Remaining, reset: X-RateLimit-Reset, reset_style: epoch_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: 'API v2. All reads are Workspace-scoped (/team/{team_id}/...). OAuth tokens are sent as ''Authorization:
    Bearer''. Filtered team tasks return 100 tasks per zero-based page; ClickUp timestamps are Unix-millisecond
    strings, so date fields stay in remote_data. Custom roles require a plan with custom roles (Enterprise).'
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://developer.clickup.com/reference
