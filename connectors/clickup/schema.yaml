            "mode": "read_only",
            "get": {
              "op": "ref",
              "model": "Ticket",
              "path": "parent"
            }
          },
          "ticket_url": {
            "mode": "read_only",
            "get": {
              "op": "pick",
              "path": "url"
            }
          },
          "remote_id": {
            "mode": "read_only",
            "get": {
              "op": "pick",
              "path": "id"
            }
          }
        },
        "sync": {
          "conflict": "source_wins"
        },
        "passthrough": true,
        "provenance": {
          "author": "human:nath@datakart.ai",
          "created_at": "2026-11-12T00:00:00Z",
          "reason": "Base mapping from the Merge unified ticketing Ticket model to ClickUp (https://developer.clickup.com/reference)"
