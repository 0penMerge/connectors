apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: wrike
  version: 1.0.0
  coreAbi: '3'
  name: Wrike
  company: Wrike
  description: Sync Wrike account tasks, folders and projects, contacts, user groups and account through the OpenMerge
    ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/wrike.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Wrike OAuth app}
api:
  base_url: https://{host}/api/v4
  describe_endpoint: /
  pagination: {mode: cursor, next_path: nextPageToken, param: nextPageToken, records_path: data}
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: Responses wrap records as {kind, data}. Task queries page with pageSize (max 1000) and nextPageToken, and
    optional fields must be repeated on every page (they live in list_path). The folder tree, contacts, groups and
    account endpoints return everything in one response; cursor paging stops when nextPageToken is absent. Task
    date filters take JSON InstantRange objects, not a plain timestamp, so reads are full hashed snapshots.
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://developers.wrike.com/api/v4/
