apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: jira
  version: 1.0.0
  coreAbi: '3'
  name: Jira
  company: Atlassian
  description: Sync Jira Cloud issues, projects, users and roles through the OpenMerge ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/jira.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Jira OAuth app}
api:
  base_url: https://api.atlassian.com/ex/jira/{cloud_id}
  describe_endpoint: /
  pagination:
    mode: offset
    param: startAt
    records_path: values
    size: 50
    limit_param: maxResults
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: Issues use enhanced JQL search with nextPageToken; project and user lists use startAt/maxResults offsets.
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://developer.atlassian.com/cloud/jira/platform/rest/v3/
