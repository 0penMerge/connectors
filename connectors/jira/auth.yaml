type: recipe
use: oauth2.authorization_code
authorize:
  url: https://auth.atlassian.com/authorize
  params: {audience: api.atlassian.com, prompt: consent}
token:
  url: https://auth.atlassian.com/oauth/token
  encoding: json
scopes:
  param: scope
  separator: ' '
  default: ['read:jira-work', 'read:jira-user', offline_access]
refresh:
  rotates: true
  grace_seconds: 0
discover:
  steps:
  - id: site
    request: {url: 'https://api.atlassian.com/oauth/token/accessible-resources'}
    choose:
      list: $
      value: id
      label: name
      into: config.cloud_id
      also: {config.site_url: url}
  identity: {tenant_id: '{config.cloud_id}'}
base_url: https://api.atlassian.com/ex/jira/{config.cloud_id}
scope_catalog:
- id: offline_access
  label: Offline access
  description: Issue refresh tokens so syncs keep running.
  recommended: true
- id: read:jira-work
  label: Read Jira work
  description: Read issues, projects and roles.
  models: [Collection, Comment, Role, Ticket]
  operations: [read]
- id: read:jira-user
  label: Read Jira users
  description: Read user profiles and email addresses.
  models: [User]
  operations: [read]
- id: write:jira-work
  label: Write Jira work
  description: Create and edit issues and comments.
notes: Atlassian 3LO. cloud_id is the site id returned by https://api.atlassian.com/oauth/token/accessible-resources
  after authorization.
