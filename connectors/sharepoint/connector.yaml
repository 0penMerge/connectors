apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: sharepoint
  version: 1.0.0
  coreAbi: '3'
  name: SharePoint
  company: Microsoft
  description: Sync SharePoint tenant users and groups through the OpenMerge file storage model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/sharepoint.svg'}
categories: [filestorage@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your SharePoint OAuth app}
api:
  base_url: https://graph.microsoft.com
  describe_endpoint: /
  pagination: {mode: next_url, next_path: '@odata.nextLink', records_path: value}
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: Microsoft Graph v1.0; list paths carry the /v1.0 prefix so @odata.nextLink continuation paths resolve against
    the host-only base_url.
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible File Storage category, from https://learn.microsoft.com/en-us/graph/api/resources/sharepoint?view=graph-rest-1.0
