{
  "apiVersion": "openmerge.dev/connector-schema/v1",
  "kind": "ConnectorSchema",
  "category": "filestorage@1",
  "discovery": {
    "mode": "declared",
    "description": "SharePoint objects use the declared Merge-compatible File Storage inventory."
  },
  "models": {
    "User": {
      "mode": "unified",
      "nativeObject": "sharepoint.users",
      "read": {
        "strategy": "hash_snapshot",
        "deletion": {
          "strategy": "full_inventory"
        },
        "requiredScopes": [
          "User.ReadBasic.All"
        ]
      },
      "identity": {
        "remoteId": "id"
      },
      "object": {
        "list_path": "/v1.0/users?$top=999&$select=id,displayName,givenName,surname,mail,userPrincipalName",
        "get_path": "/v1.0/users/{remote_id}?$select=id,displayName,givenName,surname,mail,userPrincipalName",
        "write_capabilities": [],
        "write_paths": []
      },
      "mapping": {
        "kind": "mapping",
        "source": "sharepoint.users",
        "model": {
          "ref": "User",
          "scope": "default",
          "version": 1
        },
        "fields": {
          "name": {
            "mode": "read_only",
            "get": {
              "op": "pick",
              "path": "displayName"
            }
          },
          "email_address": {
            "mode": "read_only",
            "get": {
              "op": "coalesce",
              "args": [
                {
                  "op": "pick",
                  "path": "mail"
                },
                {
                  "op": "pick",
                  "path": "userPrincipalName"
                }
              ]
            }
          },
          "remote_id": {
            "mode": "read_only",
            "get": {
              "op": "pick",
              "path": "id"
            }
          }
        },
        "sync": {
          "conflict": "source_wins"
        },
        "passthrough": true,
        "provenance": {
          "author": "human:nath@datakart.ai",
          "created_at": "2026-11-12T00:00:00Z",
          "reason": "Base mapping from the Merge unified filestorage User model to SharePoint (https://learn.microsoft.com/en-us/graph/api/resources/sharepoint?view=graph-rest-1.0)"
        }
      }
    },
    "Group": {
      "mode": "unified",
      "nativeObject": "sharepoint.groups",
      "read": {
        "strategy": "hash_snapshot",
        "deletion": {
          "strategy": "full_inventory"
        },
        "requiredScopes": [
          "GroupMember.Read.All"
        ]
      },
      "identity": {
        "remoteId": "id"
      },
      "object": {
        "list_path": "/v1.0/groups?$top=999&$select=id,displayName,description,mail,createdDateTime,groupTypes",
        "get_path": "/v1.0/groups/{remote_id}",
        "write_capabilities": [],
        "write_paths": []
      },
      "mapping": {
        "kind": "mapping",
        "source": "sharepoint.groups",
        "model": {
          "ref": "Group",
          "scope": "default",
          "version": 1
        },
        "fields": {
          "name": {
            "mode": "read_only",
            "get": {
              "op": "pick",
              "path": "displayName"
            }
          },
          "remote_id": {
            "mode": "read_only",
            "get": {
              "op": "pick",
              "path": "id"
            }
          }
        },
        "sync": {
          "conflict": "source_wins"
        },
        "passthrough": true,
        "provenance": {
          "author": "human:nath@datakart.ai",
          "created_at": "2026-11-12T00:00:00Z",
          "reason": "Base mapping from the Merge unified filestorage Group model to SharePoint (https://learn.microsoft.com/en-us/graph/api/resources/sharepoint?view=graph-rest-1.0)"
        }
      }
    }
  }
}
