{
  "apiVersion": "openmerge.dev/connector/v1",
  "kind": "Connector",
  "metadata": {
    "id": "trello",
    "version": "1.0.0",
    "coreAbi": "2",
    "name": "Trello",
    "company": "Atlassian",
    "description": "Sync a Trello board's cards, lists, labels and members through the OpenMerge ticketing model.",
    "logo": {
      "url": "https://cdn.openmerge.dev/connectors/trello.svg"
    }
  },
  "runtime": {
    "entrypoint": "plugin.py:TrelloPlugin"
  },
  "categories": [
    "ticketing@1"
  ],
  "capabilities": {
    "reads": [
      "hash_snapshot"
    ],
    "writes": [],
    "dynamicSchema": false,
    "customFields": false
  },
  "auth": {
    "type": "password",
    "driver": "api_key",
    "connection_config_fields": [
      "board_id"
    ],
    "default_scopes": [],
    "scope_catalog": []
  },
  "setup": {
    "credentialFields": [
      {
        "id": "board_id",
        "component": "text",
        "label": "Board ID",
        "required": true,
        "writeOnly": false
      },
      {
        "id": "api_key",
        "component": "secret",
        "label": "Power-Up API key",
        "required": true,
        "writeOnly": true
      },
      {
        "id": "api_token",
        "component": "secret",
        "label": "User API token",
        "required": true,
        "writeOnly": true
      }
    ]
  },
  "api": {
    "base_url": "https://api.trello.com/1/boards/{board_id}",
    "describe_endpoint": "/",
    "pagination": {
      "style": "cursor",
      "param": "cursor",
      "records_path": "records",
      "next_path": "next"
    },
    "rate_limit_headers": {
      "remaining": null,
      "reset": null,
      "reset_style": "auto_seconds"
    },
    "authorization_scheme": "OAuth",
    "schema_adapter": "declared",
    "auth_headers": {
      "Authorization": "OAuth oauth_consumer_key=\"{secret.api_key}\", oauth_token=\"{secret.api_token}\""
    },
    "notes": "One connection per board: every list is board-scoped (/1/boards/{board_id}/...). Responses are bare JSON arrays. Trello caps list results at 1000 per request and only pages with before/since object ids, so boards with more than 1000 cards return the first 1000 only. Card creation dates are encoded in the card id and not exposed as a field. Trello uses a Power-Up API key plus a user token (authorized at https://trello.com/1/authorize?key=...&scope=read&expiration=never&response_type=token). Both are sent in one header: 'Authorization: OAuth oauth_consumer_key=\"<api_key>\", oauth_token=\"<api_token>\"' (authorization_scheme OAuth; the stored credential value is the part after 'OAuth '), or alternatively as key/token query parameters. board_id is the board's id or short link."
  },
  "webhooks": {
    "supported": false,
    "automatic": false
  },
  "provenance": {
    "author": "human:nath@datakart.ai",
    "created_at": "2026-11-12T00:00:00Z",
    "reason": "Provider descriptor for the Merge-compatible Ticketing category, from https://developer.atlassian.com/cloud/trello/rest/"
  }
}
