apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: trello
  version: 1.0.0
  coreAbi: '3'
  name: Trello
  company: Atlassian
  description: Sync a Trello board's cards, lists, labels and members through the OpenMerge ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/trello.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: API key (consumer key), required: true}
  - id: client_secret
    component: secret
    label: OAuth secret
    required: true
    writeOnly: true
  instructions:
  - component: callback_url
    label: Add this callback URL to your Trello Power-Up allowed origins
api:
  base_url: https://api.trello.com/1/boards/{board_id}
  describe_endpoint: /
  pagination: {mode: single, records_path: $}
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: OAuth
  schema_adapter: declared
  notes: 'One connection per board: every list is board-scoped (/1/boards/{board_id}/...). Responses are bare JSON
    arrays. Trello caps list results at 1000 per request and only pages with before/since object ids, so boards
    with more than 1000 cards return the first 1000 only. Card creation dates are encoded in the card id and not
    exposed as a field. Trello uses a Power-Up API key plus a user token (authorized at https://trello.com/1/authorize?key=...&scope=read&expiration=never&response_type=token).
    Both are sent in one header: ''Authorization: OAuth oauth_consumer_key="<api_key>", oauth_token="<api_token>"''
    (authorization_scheme OAuth; the stored credential value is the part after ''OAuth ''), or alternatively as
    key/token query parameters. board_id is the board''s id or short link.'
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://developer.atlassian.com/cloud/trello/rest/
