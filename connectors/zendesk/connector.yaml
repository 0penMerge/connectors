{
  "apiVersion": "openmerge.dev/connector/v1",
  "kind": "Connector",
  "metadata": {
    "id": "zendesk",
    "version": "1.0.0",
    "coreAbi": "2",
    "name": "Zendesk",
    "company": "Zendesk",
    "description": "Sync Zendesk Support tickets, end users, agents, organizations, groups, tags and custom roles through the OpenMerge ticketing model.",
    "logo": {
      "url": "https://cdn.openmerge.dev/connectors/zendesk.svg"
    }
  },
  "runtime": {
    "entrypoint": "plugin.py:ZendeskPlugin"
  },
  "categories": [
    "ticketing@1"
  ],
  "capabilities": {
    "reads": [
      "hash_snapshot"
    ],
    "writes": [
      "update"
    ],
    "dynamicSchema": false,
    "customFields": false
  },
  "auth": {
    "type": "oauth2",
    "driver": "oauth2",
    "authorization_url": "https://{subdomain}.zendesk.com/oauth/authorizations/new",
    "token_url": "https://{subdomain}.zendesk.com/oauth/tokens",
    "refresh_rotates": true,
    "rotation_grace_seconds": 0,
    "scopes_param": "scope",
    "default_scopes": [
      "read"
    ],
    "scope_catalog": [
      {
        "id": "read",
        "label": "Read",
        "description": "Read access to all Support resources (tickets, users, organizations, groups, tags, custom roles).",
        "models": [
          "Account",
          "Comment",
          "Contact",
          "Role",
          "Tag",
          "Team",
          "Ticket",
          "User"
        ],
        "operations": [
          "read"
        ],
        "recommended": true
      },
      {
        "id": "write",
        "label": "Write",
        "description": "Write access to Support resources; required to update tickets."
      }
    ],
    "connection_config_fields": [
      "subdomain"
    ],
    "scope_separator": " ",
    "notes": "Per-tenant OAuth: authorization and token URLs live on the customer's {subdomain}.zendesk.com host, so the subdomain must be collected before redirecting (the token response does not return it). Zendesk issues expiring access tokens with single-use refresh tokens (each refresh returns a new refresh token and invalidates the old pair). Resource-scoped variants (tickets:read, users:read, organizations:read) exist if narrower grants are wanted."
  },
  "setup": {
    "oauthAppFields": [
      {
        "id": "client_id",
        "component": "text",
        "label": "Client ID",
        "required": true
      },
      {
        "id": "client_secret",
        "component": "secret",
        "label": "Client secret",
        "required": true,
        "writeOnly": true
      }
    ],
    "instructions": [
      {
        "component": "callback_url",
        "label": "Add this redirect URL to your Zendesk OAuth app"
      }
    ]
  },
  "api": {
    "base_url": "https://{subdomain}.zendesk.com",
    "describe_endpoint": "/",
    "pagination": {
      "style": "cursor",
      "param": "page[after]",
      "records_path": "users",
      "next_path": "meta.after_cursor"
    },
    "rate_limit_headers": {
      "remaining": null,
      "reset": null,
      "reset_style": "auto_seconds"
    },
    "authorization_scheme": "Bearer",
    "schema_adapter": "declared",
    "notes": "Tickets come from the cursor-based incremental export (/api/v2/incremental/tickets/cursor) starting at start_time=0 because GET /api/v2/tickets omits archived tickets (closed > 120 days), which would look like deletions in a full inventory. The incremental export needs an admin-role token and is limited to 10 requests/minute (30 with the High Volume add-on); deleted tickets stay in the stream with status 'deleted'. Other lists use cursor pagination (page[size]/page[after], meta.has_more). Zendesk has no single agents-only list that survives a single role filter, so User lists every user (agents, admins and end users) and Contact lists end users only; end users therefore appear in both. Custom roles require the Enterprise plan."
  },
  "webhooks": {
    "supported": false,
    "automatic": false
  },
  "provenance": {
    "author": "human:nath@datakart.ai",
    "created_at": "2026-11-12T00:00:00Z",
    "reason": "Provider descriptor for the Merge-compatible Ticketing category, from https://developer.zendesk.com/api-reference/ticketing/introduction/"
  }
}
