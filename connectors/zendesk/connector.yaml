apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: zendesk
  version: 1.0.0
  coreAbi: '3'
  name: Zendesk
  company: Zendesk
  description: Sync Zendesk Support tickets, end users, agents, organizations, groups, tags and custom roles through
    the OpenMerge ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/zendesk.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: [update]
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Zendesk OAuth app}
api:
  base_url: https://{subdomain}.zendesk.com
  describe_endpoint: /
  pagination:
    has_more_path: meta.has_more
    mode: cursor
    next_path: meta.after_cursor
    param: page[after]
    records_path: users
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: Tickets come from the cursor-based incremental export (/api/v2/incremental/tickets/cursor) starting at
    start_time=0 because GET /api/v2/tickets omits archived tickets (closed > 120 days), which would look like deletions
    in a full inventory. The incremental export needs an admin-role token and is limited to 10 requests/minute (30
    with the High Volume add-on); deleted tickets stay in the stream with status 'deleted'. Other lists use cursor
    pagination (page[size]/page[after], meta.has_more). Zendesk has no single agents-only list that survives a single
    role filter, so User lists every user (agents, admins and end users) and Contact lists end users only; end users
    therefore appear in both. Custom roles require the Enterprise plan.
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://developer.zendesk.com/api-reference/ticketing/introduction/
