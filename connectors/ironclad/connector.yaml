{
  "apiVersion": "openmerge.dev/connector/v1",
  "kind": "Connector",
  "metadata": {
    "id": "ironclad",
    "version": "1.0.0",
    "coreAbi": "2",
    "name": "Ironclad",
    "company": "Ironclad",
    "description": "Sync Ironclad contract workflows (as tickets), users and groups through the OpenMerge ticketing model.",
    "logo": {
      "url": "https://cdn.openmerge.dev/connectors/ironclad.svg"
    }
  },
  "runtime": {
    "entrypoint": "plugin.py:IroncladPlugin"
  },
  "categories": [
    "ticketing@1"
  ],
  "capabilities": {
    "reads": [
      "hash_snapshot"
    ],
    "writes": [],
    "dynamicSchema": false,
    "customFields": false
  },
  "auth": {
    "type": "oauth2",
    "driver": "oauth2",
    "authorization_url": "https://ironcladapp.com/oauth/authorize",
    "token_url": "https://ironcladapp.com/oauth/token",
    "refresh_rotates": true,
    "rotation_grace_seconds": 0,
    "scopes_param": "scope",
    "default_scopes": [
      "public.workflows.readWorkflows",
      "scim.users.readUsers",
      "scim.groups.readGroups"
    ],
    "scope_catalog": [
      {
        "id": "public.workflows.readWorkflows",
        "label": "Read workflows",
        "description": "List and read contract workflows.",
        "models": [
          "Ticket"
        ],
        "operations": [
          "read"
        ]
      },
      {
        "id": "scim.users.readUsers",
        "label": "Read users (SCIM)",
        "description": "List users through the SCIM 2.0 API.",
        "models": [
          "User"
        ],
        "operations": [
          "read"
        ]
      },
      {
        "id": "scim.groups.readGroups",
        "label": "Read groups (SCIM)",
        "description": "List groups through the SCIM 2.0 API.",
        "models": [
          "Team"
        ],
        "operations": [
          "read"
        ]
      }
    ],
    "connection_config_fields": [],
    "scope_separator": " ",
    "notes": "Register an OAuth client app in Ironclad (Company Settings > API). Authorization-code grant: GET https://ironcladapp.com/oauth/authorize (response_type=code, client_id, redirect_uri, space-separated scope, state) and POST https://ironcladapp.com/oauth/token with client_id/client_secret. Access tokens last 6 hours; each refresh returns a new refresh token (rotation). EU (eu1.ironcladapp.com) and demo (demo.ironcladapp.com) need their own app registration and host."
  },
  "setup": {
    "oauthAppFields": [
      {
        "id": "client_id",
        "component": "text",
        "label": "Client ID",
        "required": true
      },
      {
        "id": "client_secret",
        "component": "secret",
        "label": "Client secret",
        "required": true,
        "writeOnly": true
      }
    ],
    "instructions": [
      {
        "component": "callback_url",
        "label": "Add this redirect URL to your Ironclad OAuth app"
      }
    ]
  },
  "api": {
    "base_url": "https://ironcladapp.com",
    "describe_endpoint": "/",
    "pagination": {
      "style": "offset",
      "param": "page",
      "records_path": "list",
      "next_path": "next",
      "limit_param": "pageSize"
    },
    "rate_limit_headers": {
      "remaining": null,
      "reset": null,
      "reset_style": "auto_seconds"
    },
    "authorization_scheme": "Bearer",
    "schema_adapter": "declared",
    "notes": "Workflows live under /public/api/v1 and users/groups under the SCIM base /scim/v2 on the same host. GET /public/api/v1/workflows defaults to status=active, so the list path requests all four statuses; it pages with zero-based page and pageSize (max 100) and returns {page, pageSize, count, list}. SCIM lists page with 1-based startIndex and count (max 1000) and return Resources. The workflow lastUpdated query parameter filters by update time but the endpoint documents no ascending sort, so workflows are read as a full snapshot."
  },
  "webhooks": {
    "supported": false,
    "automatic": false
  },
  "provenance": {
    "author": "human:nath@datakart.ai",
    "created_at": "2026-11-12T00:00:00Z",
    "reason": "Provider descriptor for the Merge-compatible Ticketing category, from https://developer.ironcladapp.com/reference/list-all-workflows"
  }
}
