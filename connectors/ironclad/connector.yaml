apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: ironclad
  version: 1.0.0
  coreAbi: '3'
  name: Ironclad
  company: Ironclad
  description: Sync Ironclad contract workflows (as tickets), users and groups through the OpenMerge ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/ironclad.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Ironclad OAuth app}
api:
  base_url: https://ironcladapp.com
  describe_endpoint: /
  pagination:
    first: 0
    mode: page
    param: page
    records_path: list
    size: 100
    limit_param: pageSize
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: Workflows live under /public/api/v1 and users/groups under the SCIM base /scim/v2 on the same host. GET
    /public/api/v1/workflows defaults to status=active, so the list path requests all four statuses; it pages with
    zero-based page and pageSize (max 100) and returns {page, pageSize, count, list}. SCIM lists page with 1-based
    startIndex and count (max 1000) and return Resources. The workflow lastUpdated query parameter filters by update
    time but the endpoint documents no ascending sort, so workflows are read as a full snapshot.
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://developer.ironcladapp.com/reference/list-all-workflows
