apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: servicenow
  version: 1.0.0
  coreAbi: '3'
  name: ServiceNow
  company: ServiceNow, Inc.
  description: Sync ServiceNow incidents, journal comments, attachments, users, groups, roles and companies through
    the OpenMerge ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/servicenow.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: [create, update]
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your ServiceNow OAuth app}
api:
  base_url: https://{instance}.service-now.com
  describe_endpoint: /
  pagination:
    mode: offset
    param: sysparm_offset
    records_path: result
    size: 500
    limit_param: sysparm_limit
  rate_limit_headers: {remaining: X-RateLimit-Remaining, reset: X-RateLimit-Reset, reset_style: epoch_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: Table API (/api/now/table/{table}) with sysparm_offset/sysparm_limit paging; records are in result. sysparm_exclude_reference_link=true
    makes reference fields plain sys_id strings and sysparm_display_value=false returns raw values (state/priority
    are choice codes such as '1'..'8', booleans are 'true'/'false' strings, unset fields are empty strings, datetimes
    are UTC 'YYYY-MM-DD HH:MM:SS'). Ordered by sys_created_on for stable offsets. Per-instance OAuth URLs need the
    connect flow to interpolate {instance} before redirecting. Instance rate limits are admin-configured (X-RateLimit-*
    headers only when a rate-limit rule applies).
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://developer.servicenow.com/dev.do#!/reference/api/latest/rest/c_TableAPI
