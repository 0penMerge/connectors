apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: intercom
  version: 1.0.0
  coreAbi: '3'
  name: Intercom
  company: Intercom
  description: Sync Intercom conversations, contacts, companies, admins, teams and tags through the OpenMerge ticketing
    model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/intercom.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: [create, update]
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Intercom OAuth app}
api:
  base_url: https://api.intercom.io
  describe_endpoint: /
  pagination:
    mode: cursor
    next_path: pages.next.starting_after
    param: starting_after
    records_path: data
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: 'Send Intercom-Version (2.11 or later) to pin the API version; otherwise the app''s default version applies.
    US region host only: EU/AU workspaces use api.eu.intercom.io / api.au.intercom.io. Conversations and contacts
    use cursor pagination (pages.next.starting_after); companies use page/per_page (max 60, at most 10,000 companies,
    and only companies with at least one contact are listed). Timestamps are Unix integers, so created/updated datetimes
    stay in remote_data. Intercom''s separate Tickets object is only reachable through POST /tickets/search and
    is not synced; conversations are the Ticket source.'
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://developers.intercom.com/docs/references/rest-api/api.intercom.io
