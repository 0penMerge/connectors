{
  "apiVersion": "openmerge.dev/connector/v1",
  "kind": "Connector",
  "metadata": {
    "id": "dropbox",
    "version": "1.0.0",
    "coreAbi": "2",
    "name": "Dropbox",
    "company": "Dropbox",
    "description": "Sync Dropbox files, folders, team members and groups through the OpenMerge file storage model.",
    "logo": {
      "url": "https://cdn.openmerge.dev/connectors/dropbox.svg"
    }
  },
  "runtime": {
    "entrypoint": "plugin.py:DropboxPlugin"
  },
  "categories": [
    "filestorage@1"
  ],
  "capabilities": {
    "reads": [
      "hash_snapshot"
    ],
    "writes": [],
    "dynamicSchema": false,
    "customFields": false
  },
  "auth": {
    "type": "oauth2",
    "driver": "oauth2",
    "authorization_url": "https://www.dropbox.com/oauth2/authorize",
    "token_url": "https://api.dropboxapi.com/oauth2/token",
    "refresh_rotates": false,
    "rotation_grace_seconds": null,
    "scopes_param": "scope",
    "default_scopes": [
      "account_info.read",
      "files.metadata.read"
    ],
    "scope_catalog": [
      {
        "id": "account_info.read",
        "label": "Read account info",
        "description": "Read the connected account's basic profile."
      },
      {
        "id": "files.metadata.read",
        "label": "Read file metadata",
        "description": "List files and folders (list_folder).",
        "models": [
          "File",
          "Folder"
        ],
        "operations": [
          "read"
        ]
      },
      {
        "id": "members.read",
        "label": "Read team members",
        "description": "List team members (Dropbox Business team-linked apps only).",
        "models": [
          "User"
        ],
        "operations": [
          "read"
        ]
      },
      {
        "id": "groups.read",
        "label": "Read team groups",
        "description": "List team groups (Dropbox Business team-linked apps only).",
        "models": [
          "Group"
        ],
        "operations": [
          "read"
        ]
      }
    ],
    "connection_config_fields": [],
    "scope_separator": " ",
    "authorization_params": {
      "token_access_type": "offline"
    },
    "notes": "Dropbox OAuth 2 code flow; token_access_type=offline returns a long-lived refresh token that does not rotate."
  },
  "setup": {
    "oauthAppFields": [
      {
        "id": "client_id",
        "component": "text",
        "label": "Client ID",
        "required": true
      },
      {
        "id": "client_secret",
        "component": "secret",
        "label": "Client secret",
        "required": true,
        "writeOnly": true
      }
    ],
    "instructions": [
      {
        "component": "callback_url",
        "label": "Add this redirect URL to your Dropbox OAuth app"
      }
    ]
  },
  "api": {
    "base_url": "https://api.dropboxapi.com",
    "describe_endpoint": "/",
    "pagination": {
      "style": "cursor",
      "param": "cursor",
      "records_path": "entries",
      "next_path": "cursor"
    },
    "rate_limit_headers": {
      "remaining": null,
      "reset": null,
      "reset_style": "auto_seconds"
    },
    "authorization_scheme": "Bearer",
    "schema_adapter": "declared",
    "notes": "Dropbox API v2 list calls are POST RPCs: the plugin posts the initial body to list_path and continues with {cursor} on the matching /continue endpoint while has_more is true. File and Folder share one recursive list_folder walk split by .tag. Dropbox entries carry parent paths, not parent ids, so folder references stay in remote_data. User and Group use the team endpoints and require a team-linked app (members.read, groups.read)."
  },
  "webhooks": {
    "supported": false,
    "automatic": false
  },
  "provenance": {
    "author": "human:nath@datakart.ai",
    "created_at": "2026-11-12T00:00:00Z",
    "reason": "Provider descriptor for the Merge-compatible File Storage category, from https://www.dropbox.com/developers/documentation/http/documentation"
  }
}
