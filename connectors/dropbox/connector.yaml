apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: dropbox
  version: 1.0.0
  coreAbi: '3'
  name: Dropbox
  company: Dropbox
  description: Sync Dropbox files, folders, team members and groups through the OpenMerge file storage model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/dropbox.svg'}
categories: [filestorage@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Dropbox OAuth app}
api:
  base_url: https://api.dropboxapi.com
  describe_endpoint: /
  pagination:
    body: {include_deleted: false, limit: 2000, path: '', recursive: true}
    continue_path: /2/files/list_folder/continue
    has_more_path: has_more
    mode: rpc
    next_path: cursor
    path: /2/files/list_folder
    records_path: entries
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: 'Dropbox API v2 list calls are POST RPCs: rpc pagination posts the initial body to list_path and continues
    with {cursor} on the matching /continue endpoint while has_more is true. File and Folder share one recursive
    list_folder walk split by .tag. Dropbox entries carry parent paths, not parent ids, so folder references stay
    in remote_data. User and Group use the team endpoints and require a team-linked app (members.read, groups.read).'
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible File Storage category, from https://www.dropbox.com/developers/documentation/http/documentation
