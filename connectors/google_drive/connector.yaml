{
  "apiVersion": "openmerge.dev/connector/v1",
  "kind": "Connector",
  "metadata": {
    "id": "google_drive",
    "version": "1.0.0",
    "coreAbi": "2",
    "name": "Google Drive",
    "company": "Google",
    "description": "Sync Google Drive files, folders and shared drives through the OpenMerge file storage model.",
    "logo": {
      "url": "https://cdn.openmerge.dev/connectors/google_drive.svg"
    }
  },
  "runtime": {
    "entrypoint": "plugin.py:GoogleDrivePlugin"
  },
  "categories": [
    "filestorage@1"
  ],
  "capabilities": {
    "reads": [
      "hash_snapshot"
    ],
    "writes": [],
    "dynamicSchema": false,
    "customFields": false
  },
  "auth": {
    "type": "oauth2",
    "driver": "oauth2",
    "authorization_url": "https://accounts.google.com/o/oauth2/v2/auth",
    "token_url": "https://oauth2.googleapis.com/token",
    "refresh_rotates": false,
    "rotation_grace_seconds": null,
    "scopes_param": "scope",
    "default_scopes": [
      "https://www.googleapis.com/auth/drive.metadata.readonly"
    ],
    "scope_catalog": [
      {
        "id": "https://www.googleapis.com/auth/drive.metadata.readonly",
        "label": "Read Drive metadata",
        "description": "List file, folder and shared drive metadata (no file content).",
        "models": [
          "File",
          "Folder",
          "Drive"
        ],
        "operations": [
          "read"
        ],
        "recommended": true
      },
      {
        "id": "https://www.googleapis.com/auth/drive.readonly",
        "label": "Read Drive files",
        "description": "Read file metadata and content (needed only for downloads via passthrough)."
      }
    ],
    "connection_config_fields": [],
    "scope_separator": " ",
    "authorization_params": {
      "access_type": "offline",
      "prompt": "consent",
      "include_granted_scopes": "true"
    },
    "notes": "Google OAuth 2.0 web-server flow. access_type=offline with prompt=consent guarantees a refresh token; refresh tokens do not rotate. Drive metadata scopes are restricted and require Google app verification for external users."
  },
  "setup": {
    "oauthAppFields": [
      {
        "id": "client_id",
        "component": "text",
        "label": "Client ID",
        "required": true
      },
      {
        "id": "client_secret",
        "component": "secret",
        "label": "Client secret",
        "required": true,
        "writeOnly": true
      }
    ],
    "instructions": [
      {
        "component": "callback_url",
        "label": "Add this redirect URL to your Google Drive OAuth app"
      }
    ]
  },
  "api": {
    "base_url": "https://www.googleapis.com",
    "describe_endpoint": "/",
    "pagination": {
      "style": "cursor",
      "param": "pageToken",
      "records_path": "files",
      "next_path": "nextPageToken"
    },
    "rate_limit_headers": {
      "remaining": null,
      "reset": null,
      "reset_style": "auto_seconds"
    },
    "authorization_scheme": "Bearer",
    "schema_adapter": "declared",
    "notes": "Drive API v3. files.list is split into File and Folder with q=mimeType filters across all drives (corpora=allDrives, includeItemsFromAllDrives, supportsAllDrives); trashed items are excluded. Pagination uses pageToken/nextPageToken. Drive int64 values (size) are JSON strings, so size stays in remote_data. Users and groups need the Admin SDK and are not declared."
  },
  "webhooks": {
    "supported": false,
    "automatic": false
  },
  "provenance": {
    "author": "human:nath@datakart.ai",
    "created_at": "2026-11-12T00:00:00Z",
    "reason": "Provider descriptor for the Merge-compatible File Storage category, from https://developers.google.com/workspace/drive/api/reference/rest/v3"
  }
}
