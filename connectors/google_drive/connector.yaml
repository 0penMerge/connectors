apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: google_drive
  version: 1.0.0
  coreAbi: '3'
  name: Google Drive
  company: Google
  description: Sync Google Drive files, folders and shared drives through the OpenMerge file storage model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/google_drive.svg'}
categories: [filestorage@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Google Drive OAuth app}
api:
  base_url: https://www.googleapis.com
  describe_endpoint: /
  pagination: {mode: cursor, next_path: nextPageToken, param: pageToken, records_path: files}
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: Drive API v3. files.list is split into File and Folder with q=mimeType filters across all drives (corpora=allDrives,
    includeItemsFromAllDrives, supportsAllDrives); trashed items are excluded. Pagination uses pageToken/nextPageToken.
    Drive int64 values (size) are JSON strings, so size stays in remote_data. Users and groups need the Admin SDK
    and are not declared.
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible File Storage category, from https://developers.google.com/workspace/drive/api/reference/rest/v3
