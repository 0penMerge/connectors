apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: azure_devops
  version: 1.0.0
  coreAbi: '3'
  name: Azure DevOps
  company: Microsoft
  description: Sync Azure DevOps work items, projects and teams for one organization through the OpenMerge ticketing
    model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/azure_devops.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Azure DevOps OAuth app}
api:
  base_url: https://dev.azure.com/{organization}
  describe_endpoint: /
  pagination:
    first: 0
    mode: offset
    param: $skip
    records_path: value
    size: 100
    limit_param: $top
  rate_limit_headers: {remaining: X-RateLimit-Remaining, reset: X-RateLimit-Reset, reset_style: epoch_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: Every request carries api-version. Work items are read org-wide through the reporting revisions feed with
    includeLatestOnly=true (one latest revision per work item, continuation by watermark). Work item writes use
    JSON Patch documents, so none are declared. Users live on vssps.dev.azure.com / vsaex.dev.azure.com, outside
    this base URL. Work item field reference names contain dots (System.Title), so lenses address them with bracket
    paths (fields["System.Title"]) and remote_data keeps the provider's keys unchanged. System.Tags ('; '-separated
    string) stays in remote_data.
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://learn.microsoft.com/en-us/rest/api/azure/devops/?view=azure-devops-rest-7.1
