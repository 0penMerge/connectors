  "models": {
    "Conversation": {
      "mode": "unified",
      "nativeObject": "slack.conversations",
      "read": {
        "strategy": "hash_snapshot",
        "deletion": {
          "strategy": "full_inventory"
        }
      },
      "identity": {
        "remoteId": "id"
      },
      "object": {
        "list_path": "/conversations.list?types=public_channel,private_channel,mpim,im&exclude_archived=false&limit=200",
        "get_path": "/conversations.info?channel={remote_id}",
        "record_path": "channel",
        "write_capabilities": [],
        "write_paths": []
      },
      "mapping": {
        "kind": "mapping",
        "source": "slack.conversations",
        "model": {
          "ref": "Conversation",
          "scope": "default",
          "version": 1
        },
        "fields": {
          "name": {
            "mode": "read_only",
            "get": {
              "op": "pick",
              "path": "name"
            }
          },
          "description": {
            "mode": "read_only",
            "get": {
              "op": "pick",
              "path": "purpose.value"
            }
          },
          "remote_id": {
            "mode": "read_only",
            "get": {
              "op": "pick",
              "path": "id"
            }
          }
        },
        "sync": {
          "conflict": "source_wins"
        },
        "passthrough": true,
        "provenance": {
          "author": "human:nath@datakart.ai",
          "created_at": "2026-11-12T00:00:00Z",
          "reason": "Base mapping from the Merge unified chat Conversation model to Slack (https://docs.slack.dev/reference/methods)"
        }
      }
    },
