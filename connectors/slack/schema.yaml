{
  "apiVersion": "openmerge.dev/connector-schema/v1",
  "kind": "ConnectorSchema",
  "category": "chat@1",
  "discovery": {
    "mode": "declared",
    "description": "Slack objects use the declared Merge-compatible Chat inventory."
