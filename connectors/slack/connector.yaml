apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: slack
  version: 1.0.0
  coreAbi: '3'
  name: Slack
  company: Salesforce
  description: Sync Slack conversations, users and user groups through the OpenMerge chat model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/slack.svg'}
categories: [chat@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Slack OAuth app}
api:
  base_url: https://slack.com/api
  describe_endpoint: /
  pagination:
    mode: cursor
    next_path: response_metadata.next_cursor
    param: cursor
    records_path: channels
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: Slack Web API methods accept GET with query arguments. conversations.list and users.list use cursor paging
    (cursor / response_metadata.next_cursor, empty string at the end). Slack returns HTTP 200 with ok=false on errors;
    timestamps are epoch numbers, so created/updated are left in remote_data. Rate limits are per method tier and
    signalled with HTTP 429 + Retry-After.
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Chat category, from https://docs.slack.dev/reference/methods
