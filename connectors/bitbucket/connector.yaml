apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: bitbucket
  version: 1.0.0
  coreAbi: '3'
  name: Bitbucket
  company: Atlassian
  description: Sync Bitbucket Cloud workspace projects and members through the OpenMerge ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/bitbucket.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Bitbucket OAuth app}
api:
  base_url: https://api.bitbucket.org/2.0/workspaces/{workspace}
  describe_endpoint: /
  pagination:
    first: 1
    mode: page
    param: page
    records_path: values
    size: 100
    limit_param: pagelen
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: OAuth calls must go to api.bitbucket.org with a Bearer token. Collections use page/pagelen with records
    under values. Issues are only listed per repository (/repositories/{workspace}/{repo_slug}/issues), so Ticket
    is not declared.
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://developer.atlassian.com/cloud/bitbucket/rest/api-group-workspaces/
