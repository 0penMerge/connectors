          },
          "remote_id": {
            "mode": "read_only",
            "get": {
              "op": "pick",
              "path": "user.uuid"
            }
          }
        },
        "sync": {
          "conflict": "source_wins"
        },
        "passthrough": true,
        "provenance": {
          "author": "human:nath@datakart.ai",
          "created_at": "2026-11-12T00:00:00Z",
          "reason": "Base mapping from the Merge unified ticketing User model to Bitbucket (https://developer.atlassian.com/cloud/bitbucket/rest/api-group-workspaces/)"
        }
