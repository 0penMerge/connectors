{
  "apiVersion": "openmerge.dev/connector-schema/v1",
  "kind": "ConnectorSchema",
  "category": "ticketing@1",
  "discovery": {
    "mode": "declared",
    "description": "Bitbucket objects use the declared Merge-compatible Ticketing inventory."
  },
  "models": {
    "Collection": {
      "mode": "unified",
      "nativeObject": "bitbucket.projects",
      "read": {
        "strategy": "hash_snapshot",
