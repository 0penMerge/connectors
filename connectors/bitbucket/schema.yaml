              "op": "const",
              "value": "PROJECT"
            }
          },
          "remote_created_at": {
            "mode": "read_only",
            "get": {
              "op": "pick",
              "path": "created_on"
            }
          },
          "remote_updated_at": {
            "mode": "read_only",
            "get": {
              "op": "pick",
              "path": "updated_on"
            }
          },
