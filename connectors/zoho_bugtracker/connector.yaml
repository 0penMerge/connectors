{
  "apiVersion": "openmerge.dev/connector/v1",
  "kind": "Connector",
  "metadata": {
    "id": "zoho_bugtracker",
    "version": "1.0.0",
    "coreAbi": "2",
    "name": "Zoho BugTracker",
    "company": "Zoho Corporation",
    "description": "Sync Zoho BugTracker projects and portal users through the OpenMerge ticketing model (bugs are project-scoped; see omitted).",
    "logo": {
      "url": "https://cdn.openmerge.dev/connectors/zoho_bugtracker.svg"
    }
  },
  "runtime": {
    "entrypoint": "plugin.py:ZohoBugTrackerPlugin"
  },
  "categories": [
    "ticketing@1"
  ],
  "capabilities": {
    "reads": [
      "hash_snapshot"
    ],
    "writes": [],
    "dynamicSchema": false,
    "customFields": false
  },
  "auth": {
    "type": "oauth2",
    "driver": "oauth2",
    "authorization_url": "https://accounts.zoho.com/oauth/v2/auth",
    "token_url": "https://accounts.zoho.com/oauth/v2/token",
    "refresh_rotates": false,
    "rotation_grace_seconds": null,
    "scopes_param": "scope",
    "default_scopes": [
      "ZohoBugTracker.portals.READ",
      "ZohoBugTracker.projects.READ",
      "ZohoBugTracker.users.READ"
    ],
    "scope_catalog": [
      {
        "id": "ZohoBugTracker.portals.READ",
        "label": "Read portals",
        "description": "List the portals the user belongs to (GET /restapi/portals/) to resolve portal_id.",
        "recommended": true
      },
      {
        "id": "ZohoBugTracker.projects.READ",
        "label": "Read projects",
        "description": "List and read projects in the portal.",
        "models": [
          "Collection"
        ],
        "operations": [
          "read"
        ],
        "recommended": true
      },
      {
        "id": "ZohoBugTracker.users.READ",
        "label": "Read users",
        "description": "List portal users.",
        "models": [
          "User"
        ],
        "operations": [
          "read"
        ],
        "recommended": true
      },
      {
        "id": "ZohoBugTracker.bugs.READ",
        "label": "Read bugs",
        "description": "Read bugs and bug comments (project-scoped endpoints; not synced by this declarative spec)."
      }
    ],
    "connection_config_fields": [
      "portal_id"
    ],
    "scope_separator": ",",
    "authorization_params": {
      "access_type": "offline",
      "prompt": "consent"
    },
    "notes": "Zoho Accounts OAuth with ZohoBugTracker.* scopes; tokens minted with ZohoBugTracker scopes only work against bugtracker.zoho.com (not projectsapi.zoho.com) and vice versa. US data center shown; other regions use accounts.zoho.<tld> / bugtracker.zoho.<tld>. portal_id is not part of the token response: resolve it from GET /restapi/portals/ after authorization."
  },
  "setup": {
    "oauthAppFields": [
      {
        "id": "client_id",
        "component": "text",
        "label": "Client ID",
        "required": true
      },
      {
        "id": "client_secret",
        "component": "secret",
        "label": "Client secret",
        "required": true,
        "writeOnly": true
      }
    ],
    "instructions": [
      {
        "component": "callback_url",
        "label": "Add this redirect URL to your Zoho BugTracker OAuth app"
      }
    ]
  },
  "api": {
    "base_url": "https://bugtracker.zoho.com/restapi/portal/{portal_id}",
    "describe_endpoint": "/",
    "pagination": {
      "style": "offset",
      "param": "index",
      "records_path": "projects",
      "next_path": "next",
      "limit_param": "range"
    },
    "rate_limit_headers": {
      "remaining": null,
      "reset": null,
      "reset_style": "auto_seconds"
    },
    "authorization_scheme": "Zoho-oauthtoken",
    "schema_adapter": "declared",
    "notes": "Legacy REST API (Zoho marks it 'will be deprecated soon' in favor of V3). GET lists take index (1-based position of the first record) and range (default 100, max 200). Rate limit: 100 calls per API per 2 minutes, then a 30-minute lock."
  },
  "webhooks": {
    "supported": false,
    "automatic": false
  },
  "provenance": {
    "author": "human:nath@datakart.ai",
    "created_at": "2026-11-12T00:00:00Z",
    "reason": "Provider descriptor for the Merge-compatible Ticketing category, from https://www.zoho.com/projects/help/rest-api/zohoprojectsapi.html"
  }
}
