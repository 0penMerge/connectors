apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: zoho_bugtracker
  version: 1.0.0
  coreAbi: '3'
  name: Zoho BugTracker
  company: Zoho Corporation
  description: Sync Zoho BugTracker projects and portal users through the OpenMerge ticketing model (bugs are project-scoped;
    see omitted).
  logo: {url: 'https://cdn.openmerge.dev/connectors/zoho_bugtracker.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your Zoho BugTracker OAuth app}
api:
  base_url: https://bugtracker.zoho.com/restapi/portal/{portal_id}
  describe_endpoint: /
  pagination:
    first: 1
    mode: offset
    param: index
    records_path: projects
    size: 200
    limit_param: range
  rate_limit_headers: {remaining: null, reset: null, reset_style: auto_seconds}
  authorization_scheme: Zoho-oauthtoken
  schema_adapter: declared
  notes: 'Legacy REST API (Zoho marks it ''will be deprecated soon'' in favor of V3). GET lists take index (1-based
    position of the first record) and range (default 100, max 200). Rate limit: 100 calls per API per 2 minutes,
    then a 30-minute lock.'
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://www.zoho.com/projects/help/rest-api/zohoprojectsapi.html
