apiVersion: openmerge.dev/connector/v1
kind: Connector
metadata:
  id: github_issues
  version: 1.0.0
  coreAbi: '3'
  name: GitHub Issues
  company: GitHub
  description: Sync GitHub issues, repositories and teams visible to the authorizing user through the OpenMerge
    ticketing model.
  logo: {url: 'https://cdn.openmerge.dev/connectors/github_issues.svg'}
categories: [ticketing@1]
capabilities:
  reads: [hash_snapshot, timestamp_delta]
  writes: []
  dynamicSchema: false
  customFields: false
setup:
  oauthAppFields:
  - {id: client_id, component: text, label: Client ID, required: true}
  - id: client_secret
    component: secret
    label: Client secret
    required: true
    writeOnly: true
  instructions:
  - {component: callback_url, label: Add this redirect URL to your GitHub Issues OAuth app}
api:
  base_url: https://api.github.com
  describe_endpoint: /
  pagination:
    first: 1
    mode: page
    param: page
    size: 100
    limit_param: per_page
    records_path: $
  rate_limit_headers: {remaining: x-ratelimit-remaining, reset: x-ratelimit-reset, reset_style: epoch_seconds}
  authorization_scheme: Bearer
  schema_adapter: declared
  notes: 'Send Accept: application/vnd.github+json and X-GitHub-Api-Version: 2022-11-28. Pagination uses page/per_page
    (max 100); bodies are bare arrays. GET /issues treats pull requests as issues; rows carrying a pull_request
    key are pull requests. Issue writes need owner/repo/number paths, so none are declared. Organization member
    and repository-label lists need an org/repo context and are not declared.'
webhooks:
  supported: false
  automatic: false
provenance:
  author: human:nath@datakart.ai
  created_at: '2026-11-12T00:00:00Z'
  reason: Provider descriptor for the Merge-compatible Ticketing category, from https://docs.github.com/en/rest/issues/issues?apiVersion=2022-11-28
